name: MediQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ktor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Ktor tests
        run: ./gradlew :server:test
      - name: Build Ktor server
        run: ./gradlew :server:build

  web-fe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: mediqweb/mediqweb-fe
      - name: Run tests
        run: npm test
        working-directory: mediqweb/mediqweb-fe
      - name: Build
        run: npm run build
        working-directory: mediqweb/mediqweb-fe

  hono-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: mediqweb/mediqapp-api
      - name: Run tests
        run: npm test
        working-directory: mediqweb/mediqapp-api
      - name: Type check
        run: npx tsc --noEmit
        working-directory: mediqweb/mediqapp-api

  android-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Android tests
        run: ./gradlew :app:test
      - name: Build Android
        run: ./gradlew :app:assembleDebug

  openapi-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenAPI spec
        run: |
          echo "OpenAPI spec validation placeholder"
          # TODO: Add openapi-validator or swagger-cli validation