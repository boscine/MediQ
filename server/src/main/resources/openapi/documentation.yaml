openapi: 3.0.3
info:
  title: MediQ API
  description: REST API for the MediQ healthcare platform (patients, doctors, secretaries, admins).
  version: 1.0.0
servers:
  - url: http://localhost:8099
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /auth/sign-in:
    post:
      summary: Sign in and obtain an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Invalid credentials
  /auth/register:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
        '400':
          description: Registration failed
  /auth/refresh:
    post:
      summary: Refresh an access token
      responses:
        '200':
          description: Refreshed session
        '401':
          description: Invalid refresh token
  /profile:
    get:
      summary: Fetch the authenticated profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user profile
        '404':
          description: Profile not found
  /doctors:
    get:
      summary: Search doctors
      parameters:
        - name: specializationId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paged list of doctors
  /doctors/{id}:
    get:
      summary: Fetch a single doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The doctor
        '404':
          description: Doctor not found
  /doctors/{id}/schedule:
    get:
      summary: Weekly clinic hours of a doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clinic hours
  /doctors/{id}/availability:
    get:
      summary: Available slots of a doctor for a date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Available dates
  /appointments:
    get:
      summary: List appointments visible to the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paged list of appointments
  /appointments/{id}:
    get:
      summary: Fetch a single appointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The appointment
        '404':
          description: Appointment not found
  /messages/conversations:
    get:
      summary: List message conversations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conversations
  /messages/conversations/{id}/messages:
    get:
      summary: List the messages of a conversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Messages
    post:
      summary: Post a message to a conversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Message created
  /notifications:
    get:
      summary: List notifications for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications
  /specializations:
    get:
      summary: List specializations
      responses:
        '200':
          description: Specializations
  /admin/accounts:
    get:
      summary: List all accounts (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accounts grouped by role
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignInRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [username, password, fullName, mobileNumber, dateOfBirth, role]
      properties:
        username:
          type: string
        password:
          type: string
        fullName:
          type: string
        email:
          type: string
          nullable: true
        mobileNumber:
          type: string
        dateOfBirth:
          type: string
          format: date
        role:
          type: string
          enum: [patient, doctor, secretary, admin]
    AuthSession:
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        profile:
          type: object
          additionalProperties: true
